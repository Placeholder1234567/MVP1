<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>Bay Area Care Homes</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
		/>
		<style>
			[hidden] {
				display: none !important;
			}
			:root {
				--bg: #eef2f1;
				--surface: #fff;
				--ink: #132a2b;
				--muted: #566b6c;
				--line: #d5dfde;
				--accent: #0f6b63;
				--accent-ink: #fff;
				--chip: #e3ecea;
				--ok: #1f7a45;
				--warn: #a14a00;
				--display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
				--body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0c1617;
					--surface: #142224;
					--ink: #e4efed;
					--muted: #9db3b1;
					--line: #24393b;
					--accent: #4fc1b4;
					--accent-ink: #06201e;
					--chip: #1c3133;
					--ok: #5ccf8a;
					--warn: #f29a4a;
					color-scheme: dark;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font-family: var(--body);
				font-size: 16px;
				line-height: 1.45;
			}
			.wrap {
				max-width: 760px;
				margin: 0 auto;
				padding-left: max(16px, env(safe-area-inset-left, 0px));
				padding-right: max(16px, env(safe-area-inset-right, 0px));
			}
			header {
				position: sticky;
				top: 0;
				z-index: 5;
				background: var(--surface);
				border-bottom: 1px solid var(--line);
				padding-top: env(safe-area-inset-top, 0px);
			}
			header .wrap {
				padding-block: 12px;
				display: grid;
				gap: 8px;
			}
			h1 {
				font-family: var(--display);
				font-weight: 800;
				font-size: 22px;
				margin: 0;
				letter-spacing: -0.01em;
			}
			.count {
				font-family: var(--body);
				font-weight: 400;
				font-size: 14px;
				color: var(--muted);
				margin-left: 6px;
			}
			.filters {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 6px;
			}
			.filters .q {
				grid-column: 1/-1;
			}
			input,
			select,
			textarea,
			button {
				font: inherit;
				font-size: 15px;
				color: var(--ink);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 9px 10px;
				min-width: 0;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.check {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 14px;
				color: var(--muted);
			}
			.check input {
				width: 18px;
				height: 18px;
			}
			main .wrap {
				padding-block: 12px 40px;
				display: grid;
				gap: 12px;
			}
			.panel,
			.card {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 14px;
				padding: 14px;
				display: grid;
				gap: 10px;
				min-width: 0;
			}
			.panel h2 {
				font-family: var(--display);
				font-size: 18px;
				margin: 0;
			}
			.muted {
				color: var(--muted);
				font-size: 14px;
			}
			.btn {
				background: var(--accent);
				color: var(--accent-ink);
				border: 0;
				font-weight: 700;
				padding: 11px 14px;
				border-radius: 10px;
				cursor: pointer;
			}
			.ghost {
				background: transparent;
				color: var(--accent);
				border: 1px solid var(--line);
				font-weight: 700;
				cursor: pointer;
			}
			.auth {
				display: grid;
				gap: 8px;
			}
			.link {
				background: none;
				border: 0;
				padding: 0;
				color: var(--accent);
				font-weight: 700;
				text-decoration: underline;
				cursor: pointer;
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: center;
			}
			.chips {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.chip {
				font-size: 13px;
				padding: 3px 10px;
				border-radius: 99px;
				background: var(--chip);
				white-space: nowrap;
			}
			.top {
				display: flex;
				justify-content: space-between;
				gap: 10px;
				align-items: flex-start;
			}
			.name {
				font-family: var(--display);
				font-weight: 600;
				font-size: 18px;
				line-height: 1.2;
				overflow-wrap: anywhere;
			}
			.kind {
				font-size: 13px;
				color: var(--muted);
			}
			.status {
				font-size: 12px;
				font-weight: 700;
				padding: 4px 10px;
				border-radius: 99px;
				background: var(--chip);
				white-space: nowrap;
			}
			.status[data-s='Interested'],
			.status[data-s='Demo booked'],
			.status[data-s='Visited'] {
				color: var(--ok);
			}
			.status[data-s='Not interested'],
			.status[data-s='Do not contact'] {
				color: var(--warn);
			}
			.acts {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 8px;
			}
			.acts a {
				text-align: center;
				text-decoration: none;
				font-weight: 700;
				font-size: 14px;
				padding: 11px 6px;
				border-radius: 10px;
				border: 1px solid var(--line);
				background: var(--bg);
				color: var(--ink);
			}
			.acts .na {
				opacity: 0.4;
				pointer-events: none;
			}
			dl {
				display: grid;
				grid-template-columns: max-content 1fr;
				gap: 4px 12px;
				margin: 0;
				font-size: 14.5px;
			}
			dt {
				color: var(--muted);
			}
			dd {
				margin: 0;
				min-width: 0;
				overflow-wrap: anywhere;
				font-variant-numeric: tabular-nums;
			}
			details summary {
				cursor: pointer;
				color: var(--accent);
				font-weight: 700;
				font-size: 14.5px;
			}
			.grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
				margin-top: 10px;
			}
			.grid label {
				display: grid;
				gap: 3px;
				font-size: 12.5px;
				color: var(--muted);
			}
			.grid .full {
				grid-column: 1/-1;
			}
			.grid input,
			.grid select,
			.grid textarea {
				width: 100%;
			}
			.saved {
				font-size: 12.5px;
				color: var(--ok);
				min-height: 1em;
			}
			.saved.err {
				color: var(--warn);
			}
			.gone {
				font-size: 12px;
				color: var(--warn);
				font-weight: 700;
			}
			.more {
				justify-self: center;
			}
			@media (max-width: 420px) {
				.grid {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div class="wrap">
				<h1>Bay Area care homes<span class="count" id="count"></span></h1>
				<div class="filters" id="filters" hidden>
					<input
						class="q"
						id="q"
						type="search"
						placeholder="Search name, owner, city or notes"
						aria-label="Search"
					/>
					<select id="fgroup" aria-label="Type">
						<option value="">All types</option>
					</select>
					<select id="fcounty" aria-label="County">
						<option value="">All counties</option>
					</select>
					<select id="fstatus" aria-label="Outreach status">
						<option value="">Any status</option>
					</select>
					<select id="fsort" aria-label="Sort">
						<option value="city">By city</option>
						<option value="name">By name</option>
						<option value="beds">Most beds</option>
						<option value="recent">Recent contact</option>
					</select>
					<label class="check"><input type="checkbox" id="femail" /> Has email</label>
					<label class="check"><input type="checkbox" id="fnew" /> Not contacted yet</label>
					<label class="check"
						><input type="checkbox" id="fgone" /> Show homes no longer listed</label
					>
				</div>
			</div>
		</header>
		<main>
			<div class="wrap">
				<section class="panel" id="login" hidden>
					<h2>Sign in</h2>
					<p class="muted">Only emails added to the tracker can see the list.</p>
					<form id="loginForm" class="auth">
						<input
							id="email"
							type="email"
							required
							autocomplete="email"
							placeholder="you@example.com"
							aria-label="Email"
						/>
						<input
							id="password"
							type="password"
							required
							autocomplete="current-password"
							placeholder="Password"
							aria-label="Password"
						/>
						<button class="btn">Sign in</button>
					</form>
					<p class="muted" id="loginMsg" aria-live="polite"></p>
					<p class="muted">
						First time here?
						<button class="link" type="button" id="toSignUp">Create an account</button>
					</p>
				</section>
				<section class="panel" id="signup" hidden>
					<h2>Create your account</h2>
					<p class="muted">
						Use the email you were added with and pick a password (8 or more characters).
					</p>
					<form id="signUpForm" class="auth">
						<input
							id="newEmail"
							type="email"
							required
							autocomplete="email"
							placeholder="you@example.com"
							aria-label="Email"
						/>
						<input
							id="newPassword"
							type="password"
							required
							minlength="8"
							autocomplete="new-password"
							placeholder="New password (8+ characters)"
							aria-label="New password"
						/>
						<input
							id="newPassword2"
							type="password"
							required
							minlength="8"
							autocomplete="new-password"
							placeholder="Type the password again"
							aria-label="Type the password again"
						/>
						<button class="btn">Create account</button>
					</form>
					<p class="muted" id="signUpMsg" aria-live="polite"></p>
					<p class="muted">
						Already have an account?
						<button class="link" type="button" id="toSignIn">Sign in</button>
					</p>
				</section>
				<section class="panel" id="status" hidden>
					<p class="muted" id="refreshText"></p>
					<div class="chips" id="stats"></div>
					<div class="row">
						<button class="ghost" id="exportBtn">Download CSV</button
						><button class="ghost" id="signOut">Sign out</button>
					</div>
				</section>
				<div id="list"></div>
				<button class="ghost more" id="more" hidden>Show more</button>
			</div>
		</main>

		<script src="config.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
		<script src="tracker.js"></script>
	</body>
</html>
