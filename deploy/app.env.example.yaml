# Copy to deploy/app.env.yaml (gitignored) to add or override app settings for
# web and worker. Values are not secrets: secrets go in Secret Manager.

# Lomi (Claude on Vertex AI, Speech-to-Text). Leave out to use the local fallback.
# VERTEX_REGION: "global"
# LOMI_MODEL: "claude-sonnet-5-5"
# LOMI_FAST_MODEL: "claude-haiku-5-5"
# STT_RECOGNIZER: "projects/<project>/locations/<region>/recognizers/<recognizer>"

# Messaging (after the AWS side is set up, deploy/README.md step 5).
# PUSH_DRIVER: "fcm"
# EMAIL_DRIVER: "ses"
# SMS_DRIVER: "aws"
# AWS_REGION: "us-east-1"
# AWS_ROLE_ARN: "arn:aws:iam::<account>:role/guad-messaging"
# SES_FROM_ADDRESS: "Guad <no-reply@your-domain>"
# SES_CONFIGURATION_SET: "guad-events"
# SMS_ORIGINATION_IDENTITY: "<phone number ID>"
# SMS_CONFIGURATION_SET: "guad-sms-events"
# SES_EVENTS_TOPIC_ARN: "arn:aws:sns:us-east-1:<account>:guad-ses-events"
# SMS_EVENTS_TOPIC_ARN: "arn:aws:sns:us-east-1:<account>:guad-sms-events"
# SMS_INBOUND_TOPIC_ARN: "arn:aws:sns:us-east-1:<account>:guad-sms-inbound"

# A custom domain for the web service (also add it to Identity Platform).
# APP_URL: "https://app.your-domain"
# The canonical origin is a build-time setting in SvelteKit 3 (vite.config.ts
# paths.origin): set APP_ORIGIN for the Cloud Build step instead.
# If the domain is served through an external Application Load Balancer, the
# client address is the second to last X-Forwarded-For entry. Without this,
# every user shares the balancer's address and its per-IP sign-in limits.
# XFF_DEPTH: "2"

# Board photos (message.uploadPhoto): a private bucket with uniform access and
# public access prevention, writable by the web service account. Without it,
# photos go to the container's disk and are lost on redeploy.
# MEDIA_BUCKET: "<project>-guad-media"
