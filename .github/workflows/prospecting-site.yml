name: Prospecting site

# Publishes tools/prospecting/site to GitHub Pages. Its config.js holds only
# public Supabase settings; the database rules decide who sees data. Needs
# Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['tools/prospecting/site/**', '.github/workflows/prospecting-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: tools/prospecting/site
      - id: deploy
        uses: actions/deploy-pages@v5
