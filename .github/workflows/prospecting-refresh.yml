name: Prospecting refresh

# Every morning: download the state care-home licensing lists and save them
# to Supabase (tools/prospecting/sync_supabase.py). Needs the repository
# secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Run it by hand from
# Actions > Prospecting refresh > Run workflow. A failed or partial download
# fails the run (GitHub emails you) and removes nothing.
on:
  schedule:
    - cron: '17 14 * * *' # 7:17 Pacific (daylight time), 6:17 in winter
  workflow_dispatch:
    inputs:
      types:
        description: 'Home types: idd, nursing, elderly, day, other (comma separated)'
        default: 'idd,nursing'

permissions:
  contents: read

concurrency:
  group: prospecting-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh care-home list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/prospecting/requirements.txt
      - name: Download and save to Supabase
        working-directory: tools/prospecting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REFRESH_TYPES: ${{ inputs.types || vars.REFRESH_TYPES || 'idd,nursing' }}
          GUAD_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python sync_supabase.py --cache "$RUNNER_TEMP/downloads"
